<style>
body{margin:0;background:#000000}
a{color:#ff9ad6}a:hover{color:#ffd0ec}
.sign .tubes,.sign .board{transition:opacity .25s}
.sign.off .tubes{opacity:.12}
.sign.off .board{opacity:.35}
.sign.on .tubes{animation:flickTubes 2.6s linear both}
.sign.on .board{animation:flickBoard 2.6s linear both}
.sign.on .buzz{animation:buzz 6.5s steps(1,end) 3s infinite}
.sign.on .buzzCore{animation:buzzCore 6.5s steps(1,end) 3s infinite}
@keyframes buzzCore{0%{opacity:1}60%{opacity:0}61%{opacity:1}63%{opacity:0}65%{opacity:1}100%{opacity:1}}
@keyframes flickTubes{0%,10%{opacity:.12}11%{opacity:1}13%,24%{opacity:.12}25%{opacity:1}27%{opacity:.3}44%{opacity:.3}46%,100%{opacity:1}}
@keyframes flickBoard{0%,10%{opacity:.35}11%{opacity:1}13%,24%{opacity:.35}25%{opacity:1}27%,44%{opacity:.5}46%,100%{opacity:1}}
@keyframes buzz{0%{stroke:var(--neon)}60%{stroke:#4a2440}61%{stroke:var(--neon)}63%{stroke:#4a2440}65%{stroke:var(--neon)}100%{stroke:var(--neon)}}
@media (prefers-reduced-motion: reduce){.sign.on .tubes,.sign.on .board,.sign.on .buzz,.sign.on .buzzCore{animation:none}}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #ffd0ec;outline-offset:3px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.crowd{-webkit-mask-image:linear-gradient(to bottom,#000 78%,transparent);mask-image:linear-gradient(to bottom,#000 78%,transparent)}
.greenwall{background-color:#123628;background-image:url(images/green-tile.jpg);background-size:640px 640px;background-repeat:repeat;background-position:center top}
.chev{transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
details[open] summary{color:#ffd0ec}
</style>
<link href="https://fonts.googleapis.com/css2?family=Yesteryear&amp;display=swap" rel="stylesheet">
<style>
.rwSign .tubes{animation:rwFlick 2.6s linear both}
@keyframes rwFlick{0%,10%{opacity:.12}11%{opacity:1}13%,24%{opacity:.12}25%{opacity:1}27%{opacity:.3}44%{opacity:.3}46%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.rwSign .tubes{animation:none}}
.wallbg{background-color:#123a6b;background-image:url(images/wall-blue.jpg);background-size:cover;background-position:center}
</style>
</head>

<section id="about" aria-labelledby="aboutTitle" style="max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; gap: 56px 0; align-items: center">
<h2 id="aboutTitle" style="flex: 1 1 100%; margin: 0; text-align: center; color: {{tubeCore}}; font-size: 96px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; text-shadow: 0 0 6px {{neon}}, 0 0 18px {{neon}}, 0 0 40px {{neonSoft}}, 0 0 80px {{neonSoft}}">About me</h2>
<img src="images/alexi-cutout.png" alt="Alexi tattooing a client" style="position: relative; z-index: 1; flex: 1 1 320px; display: block; width: 100%; max-width: 440px; height: auto; align-self: center; filter: drop-shadow(0 18px 24px rgba(0,0,0,0.55)); -webkit-mask-image: linear-gradient(to bottom, #000000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000000 82%, transparent 100%)">
<div style="flex: 999 1 420px; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 20px; box-sizing: border-box; margin-bottom: -96px; padding: 44px 48px 150px; background: #000000; border: 1px solid #3a2232; border-bottom: none; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,0.6); -webkit-mask-image: linear-gradient(to bottom, #000000 62%, transparent 100%); mask-image: linear-gradient(to bottom, #000000 62%, transparent 100%)">
<h3 style="margin: 0; font-size: 44px; line-height: 1.1; font-weight: 200; letter-spacing: 0.02em">Hi, I'm Alexi.</h3>
<p style="margin: 0; font-size: 19px; line-height: 1.65; color: #ece6ea">Alexi has rewatched <em>It’s Always Sunny in Philadelphia</em> more times than she’s tattooed a rose, and she’s tattooed a <em>lot</em> of roses. Ask her for a Kitten Mittens flash piece. She’ll say no. She’ll think about it all week.</p>
<p style="margin: 0; font-size: 19px; line-height: 1.65; color: #ece6ea">Fair warning: you’ll leave with fresh ink and a free therapy session. She is, scientifically, the easiest person in town to vent to about how much men suck. No judgment, just a buzzing needle and a very supportive nod.</p>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 14px; padding-top: 8px">
<a href="about.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 999px; border: 1px solid #5a3a4e; color: #f7e6f1; text-decoration: none; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 15px">More about me</a>
<a href="#book" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 28px; border-radius: 999px; background: {{neon}}; color: #120009; text-decoration: none; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 15px">Request a booking</a>
</div>
</div>

<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #d9c3d1; max-width: 640px">Not every tattoo needs a big consult. Catch a flash day or one of the special days for something small, quick and a little cheaper.</p>

<span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: #120009; color: #ffffff; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Next up</span>
<h3 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">Flash Tattoo Day</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.5; font-weight: 400">Pick a pre-drawn design off the flash sheet and get it done the same day. Walk-ins welcome, first come first served.</p>
<p style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">From [$PRICE] · Saturday, [Date]</p>
</article>
<article style="border-radius: 12px; padding: 30px; display: flex; flex-direction: column; gap: 12px; background: #ffe14d; color: #120009; box-shadow: 0 0 0 8px #ffffff, 0 20px 34px rgba(0,0,0,0.7); transform: rotate(3deg) translateY(18px)">
<h3 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em">Friday the 13th</h3>
<p style="margin: 0; font-size: 17px; line-height: 1.5; font-weight: 400">The classic tattoo holiday. Spooky little flash pieces at a set price, only on the day.</p>
<p style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase">[$13 + tip deal] · Next: [Date]</p>

<section id="faq" aria-labelledby="faqTitle" style="position: relative; z-index: 1; box-sizing: border-box; width: calc(100% - 48px); max-width: 1200px; margin: 96px auto; padding: 56px 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px; background: #000000; border: 1px solid #3a2232; border-radius: 16px; box-shadow: 0 24px 48px rgba(0,0,0,0.7)">
<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<h2 id="faqTitle" style="margin: 0; text-align: center; color: {{tubeCore}}; font-size: 96px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; text-shadow: 0 0 6px {{neon}}, 0 0 18px {{neon}}, 0 0 40px {{neonSoft}}, 0 0 80px {{neonSoft}}">FAQs</h2>
<div style="display: flex; flex-direction: column; border-top: 1px solid #3a2a34">
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">How does booking work?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Tap Book Now and send a request with your idea, placement, size and any reference photos. Alexi takes one client a day, so she reviews every request personally, then sends back a price estimate and deposit info. Your date is locked in once the deposit is paid.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">How does the deposit work?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">The deposit is [$AMOUNT] and it goes toward the final price of your tattoo. It's non-refundable, but it can move with you once if you reschedule with at least 48 hours' notice.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">Can I reschedule or cancel?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Life happens. Reschedule with 48+ hours' notice and your deposit carries over. Cancellations or no-shows with less than 48 hours' notice forfeit the deposit.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">How should I prepare for my appointment?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Eat a real meal, drink plenty of water, get a good night's sleep and skip alcohol for 24 hours before. Wear comfy clothes that give easy access to the placement, and bring a valid photo ID.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">Does it hurt?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Honestly? A little. Most people compare it to an annoying cat scratch. Ribs, feet and spine are spicier. Breaks are always allowed, and snacks are encouraged.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">How do I take care of my new tattoo?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Keep the wrap on for [X hours], then wash gently with unscented soap and apply a thin layer of aftercare. No soaking, tanning or picking for 2–3 weeks. You'll leave with full written instructions.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">Do you do cover-ups or touch-ups?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Yes to cover-ups: send a clear photo of the old tattoo with your request so Alexi can plan. Touch-ups on her own work are free within [3 months] of your appointment.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 24px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 22px; font-weight: 600; color: #ffffff">Do I need to be 18?<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 14px 0 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Yes. You must be 18 or older with a valid government-issued photo ID. No exceptions, even with a parent present.</p></details>

<script>
DC.define("Site_w_Plastic", {"neon": "#ff3fb0", "glowStrength": 1, "boardOpacity": 0.07}, (function () {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: true };
  }
  hexToRgb(hex) {
    const h = (hex || '#ff3fb0').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  renderVals() {
    const neon = this.props.neon ?? '#ff3fb0';
    const k = this.props.glowStrength ?? 1;
    const [r, g, b] = this.hexToRgb(neon);
    const c = (a) => `rgba(${r},${g},${b},${a})`;
    const mix = (t) => `rgb(${Math.round(r + (255 - r) * t)},${Math.round(g + (255 - g) * t)},${Math.round(b + (255 - b) * t)})`;
    const board = this.props.boardOpacity ?? 0.07;
    return {
      signState: this.state.on ? 'on' : 'off',
      neon,
      neonSoft: c(0.45),
      neonText: mix(0.45),
      tubeMid: mix(0.5),
      tubeCore: mix(0.88),
      glow: `drop-shadow(0 0 ${3 * k}px ${neon}) drop-shadow(0 0 ${10 * k}px ${neon}) drop-shadow(0 0 ${24 * k}px ${c(0.85)}) drop-shadow(0 0 ${48 * k}px ${c(0.6)})`,
      boardOpacity: board,
      edgeOpacity: Math.min(0.6, board * 3)
    };
  }
}

return Component;
})());
DC.define("Gallery_Wall", {}, (function () {

class Component extends DCLogic {}

return Component;
})());
DC.define("Sticker_Wall", {}, (function () {

class Component extends DCLogic {}

return Component;
})());
DC.mount("Site_w_Plastic", document.getElementById('app'));
</script>
