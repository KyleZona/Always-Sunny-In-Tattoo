<script>
DC.define("M_Home", {"neon": "#ff3fb0"}, (function () {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false };
  }
  hexToRgb(hex) {
    const h = (hex || '#ff3fb0').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  renderVals() {
    const neon = this.props.neon ?? '#ff3fb0';
    const [r, g, b] = this.hexToRgb(neon);
    const c = (a) => `rgba(${r},${g},${b},${a})`;
    const mix = (t) => `rgb(${Math.round(r + (255 - r) * t)},${Math.round(g + (255 - g) * t)},${Math.round(b + (255 - b) * t)})`;
    return {
      neon,
      neonSoft: c(0.45),
      tubeMid: mix(0.5),
      tubeCore: mix(0.88),
      glow: `drop-shadow(0 0 2px ${neon}) drop-shadow(0 0 6px ${neon}) drop-shadow(0 0 14px ${c(0.85)}) drop-shadow(0 0 28px ${c(0.6)})`,
      menu: this.state.menu,
      menuStr: this.state.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !this.state.menu })
    };
  }
}

return Component;
})());
DC.mount("M_Home", document.getElementById('app'));
</script>
