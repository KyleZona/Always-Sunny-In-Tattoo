<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alukx Alexi Tattoo — FAQs</title>
<script>
/* Wide screens get the full desktop site. Add ?mobile to stay here. */
(function(){try{if(/[?&]mobile/.test(location.search))sessionStorage.setItem('siteView','mobile');if(/[?&]desktop/.test(location.search))sessionStorage.setItem('siteView','desktop');var v=sessionStorage.getItem('siteView');if(v==='mobile')return;}catch(e){}
if(window.matchMedia('(min-width: 900px)').matches)location.replace('faq.html'+location.hash);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000}
a{color:#ff9ad6}a:hover{color:#ffd0ec}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #ffd0ec;outline-offset:3px}
button{font-family:'Josefin Sans',system-ui,sans-serif;cursor:pointer}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.chev{transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
details[open] summary{color:#ffd0ec}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc-M_FAQ">
<div style="width: 100%; max-width: 560px; margin: 0 auto; box-sizing: border-box; background-color: #000000; color: #f7e6f1; font-family: 'Josefin Sans', system-ui, sans-serif; font-weight: 300">

<header style="position: relative; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; background: #000000; border-bottom: 1px solid #2a1a24">
<a href="mobile.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #f7e6f1; text-decoration: none; font-size: 14px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase">Alukx Alexi</a>
<div style="display: flex; align-items: center; gap: 8px">
<a href="mobile-book.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; background: {{neon}}; color: #120009; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">Book</a>
<button type="button" aria-label="Menu" aria-expanded="{{menuStr}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid #5a3a4e; background: transparent; color: #f7e6f1; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></button>
</div>
</header>
<sc-if value="{{menu}}" hint-placeholder-val="{{false}}">
<nav aria-label="Main" style="display: flex; flex-direction: column; padding: 4px 16px 12px; background: #0b0509; border-bottom: 1px solid #2a1a24; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase">
<a href="mobile.html" style="display: flex; align-items: center; min-height: 48px; color: #f7e6f1; text-decoration: none; border-bottom: 1px solid #2a1a24">Home</a>
<a href="mobile-about.html" style="display: flex; align-items: center; min-height: 48px; color: #f7e6f1; text-decoration: none; border-bottom: 1px solid #2a1a24">About</a>
<a href="mobile-work.html" style="display: flex; align-items: center; min-height: 48px; color: #f7e6f1; text-decoration: none; border-bottom: 1px solid #2a1a24">Recent work</a>
<a href="mobile-book.html" style="display: flex; align-items: center; min-height: 48px; color: #f7e6f1; text-decoration: none">Book now</a>
</nav>
</sc-if>

<main style="position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.35"><dc-import name="Sticker_Wall" hint-size="100%,100%"></dc-import></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(to bottom, #000000 0px, rgba(0,0,0,0.6) 80px, rgba(0,0,0,0.6) calc(100% - 80px), #000000 100%)"></div>
<div style="position: relative; z-index: 1; padding: 36px 16px 44px; display: flex; flex-direction: column; gap: 20px">
<h1 style="margin: 0; text-align: center; color: {{tubeCore}}; font-size: 52px; line-height: 1; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; text-shadow: 0 0 6px {{neon}}, 0 0 18px {{neon}}, 0 0 40px {{neonSoft}}">FAQs</h1>
<div style="display: flex; flex-direction: column; padding: 4px 18px; background: #000000; border: 1px solid #3a2232; border-radius: 16px">
<details open style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">How does booking work?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">Send a request with your idea, placement, size and photos. Alexi reviews it and sends a price and deposit info. Your date locks once the deposit is paid.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">How does the deposit work?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">[$AMOUNT], and it goes toward your tattoo. Non-refundable, but it moves with you once if you reschedule 48+ hours ahead.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">Can I reschedule or cancel?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">48+ hours' notice and your deposit carries over. Less than 48 hours or a no-show forfeits it.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">How should I prepare?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">Eat, hydrate, sleep, and skip alcohol for 24 hours. Wear comfy clothes and bring a photo ID.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">Does it hurt?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">A little, like an annoying cat scratch. Ribs, feet and spine are spicier. Breaks and snacks welcome.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">Aftercare?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">Wrap on for [X hours], wash with unscented soap, thin layer of aftercare. No soaking, tanning or picking for 2–3 weeks.</p></details>
<details style="border-bottom: 1px solid #3a2a34; padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">Cover-ups or touch-ups?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">Cover-ups yes: add a photo of the old tattoo. Touch-ups on her work are free within [3 months].</p></details>
<details style="padding: 8px 0"><summary style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 17px; line-height: 1.3; font-weight: 600; color: #ffffff">Do I need to be 18?<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{neon}}"><path d="M6 9l6 6 6-6"></path></svg></summary><p style="margin: 4px 0 10px; font-size: 16px; line-height: 1.6; font-weight: 400; color: #ece6ea">Yes, 18+ with a valid photo ID. No exceptions.</p></details>
</div>
</div>
</main>

<section aria-labelledby="askTitle" style="padding: 40px 20px; border-top: 1px solid #2a1a24; background: #0b0509; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
<h2 id="askTitle" style="margin: 0; font-size: 28px; font-weight: 200">Still have a question?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.55; color: #d9c3d1">Add it to your booking request.</p>
<a href="mobile-book.html" style="display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; border-radius: 999px; background: {{neon}}; color: #120009; text-decoration: none; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 15px; box-shadow: 0 0 24px {{neonSoft}}">Request a date</a>
</section>

<footer style="padding: 28px 20px 36px; border-top: 1px solid #2a1a24; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400">Alukx Alexi Tattoo</span>
<span style="font-size: 14px; color: #b9a3b1">[Studio address] · [Hours]</span>
</footer>

</div>
</template>
<template id="dc-Sticker_Wall">
<div id="stickerWall" data-wall="stickers" style="position: relative; width: 100%; height: 100%; min-height: 1700px; overflow: hidden; background-color: #000000"></div>
</template>
<p style="margin:0;padding:0 16px 28px;text-align:center;font-family:'Josefin Sans',system-ui,sans-serif;font-size:14px"><a href="faq.html?desktop">View the desktop site</a></p>
<script src="assets/js/dc.js"></script>
<script>
DC.define("M_FAQ", {"neon": "#ff3fb0"}, (function () {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false };
  }
  hexToRgb(hex) {
    const h = (hex || '#ff3fb0').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  renderVals() {
    const neon = this.props.neon ?? '#ff3fb0';
    const [r, g, b] = this.hexToRgb(neon);
    const mix = (t) => `rgb(${Math.round(r + (255 - r) * t)},${Math.round(g + (255 - g) * t)},${Math.round(b + (255 - b) * t)})`;
    return {
      neon,
      neonSoft: `rgba(${r},${g},${b},0.45)`,
      tubeCore: mix(0.88),
      menu: this.state.menu,
      menuStr: this.state.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !this.state.menu })
    };
  }
}

return Component;
})());
DC.define("Sticker_Wall", {}, (function () {

class Component extends DCLogic {}

return Component;
})());
DC.mount("M_FAQ", document.getElementById('app'));
</script>
<script src="data/catalog.js"></script>
<script src="data/layout.js"></script>
<script src="assets/js/walls.js"></script>
</body>
</html>
