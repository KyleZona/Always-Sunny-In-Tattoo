<script>
DC.define("Work", {"neon": "#ff3fb0"}, (function () {

class Component extends DCLogic {
  hexToRgb(hex) {
    const h = (hex || '#ff3fb0').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  renderVals() {
    const neon = this.props.neon ?? '#ff3fb0';
    const [r, g, b] = this.hexToRgb(neon);
    const c = (a) => `rgba(${r},${g},${b},${a})`;
    const mix = (t) => `rgb(${Math.round(r + (255 - r) * t)},${Math.round(g + (255 - g) * t)},${Math.round(b + (255 - b) * t)})`;
