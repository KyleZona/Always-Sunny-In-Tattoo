<div style="display: flex; flex-direction: column; gap: 10px">

</div>
<a href="mobile-work.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; background: #000000; border: 1px solid #3a2232; border-radius: 12px; text-decoration: none">

<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: {{neonText}}">Her style</span>
<span style="font-size: 15px; line-height: 1.5; font-weight: 400; color: #ece6ea">[Styles she loves most]</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; background: #000000; border: 1px solid #3a2232; border-radius: 12px">

<span style="font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 400">Alukx Alexi Tattoo</span>
<span style="font-size: 14px; color: #b9a3b1">[Studio address] · [Hours]</span>

<p style="margin:0;padding:0 16px 28px;text-align:center;font-family:'Josefin Sans',system-ui,sans-serif;font-size:14px"><a href="about.html?desktop">View the desktop site</a></p>
<script src="assets/js/dc.js"></script>
<script>
DC.define("M_About", {"neon": "#ff3fb0"}, (function () {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: false };
  }
  hexToRgb(hex) {
    const h = (hex || '#ff3fb0').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  renderVals() {
    const neon = this.props.neon ?? '#ff3fb0';
    const [r, g, b] = this.hexToRgb(neon);
    const mix = (t) => `rgb(${Math.round(r + (255 - r) * t)},${Math.round(g + (255 - g) * t)},${Math.round(b + (255 - b) * t)})`;
    return {
      neon,
      neonSoft: `rgba(${r},${g},${b},0.45)`,
      neonText: mix(0.45),
      tubeCore: mix(0.88),
      menu: this.state.menu,
      menuStr: this.state.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !this.state.menu })
    };
  }
}

return Component;
})());
DC.mount("M_About", document.getElementById('app'));
</script>
</body>
