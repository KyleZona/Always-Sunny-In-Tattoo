<div style="display: flex; flex-direction: column; border-top: 1px solid #3a2a34">
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">How does booking work?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Tap Book Now and send a request with your idea, placement, size and any reference photos. Alexi takes one client a day, so she reviews every request personally, then sends back a price estimate and deposit info. Your date is locked in once the deposit is paid.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">How does the deposit work?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">The deposit is [$AMOUNT] and it goes toward the final price of your tattoo. It's non-refundable, but it can move with you once if you reschedule with at least 48 hours' notice.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">Can I reschedule or cancel?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Life happens. Reschedule with 48+ hours' notice and your deposit carries over. Cancellations or no-shows with less than 48 hours' notice forfeit the deposit.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">How should I prepare for my appointment?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Eat a real meal, drink plenty of water, get a good night's sleep and skip alcohol for 24 hours before. Wear comfy clothes that give easy access to the placement, and bring a valid photo ID.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">Does it hurt?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Honestly? A little. Most people compare it to an annoying cat scratch. Ribs, feet and spine are spicier. Breaks are always allowed, and snacks are encouraged.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">How do I take care of my new tattoo?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Keep the wrap on for [X hours], then wash gently with unscented soap and apply a thin layer of aftercare. No soaking, tanning or picking for 2–3 weeks. You'll leave with full written instructions.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">Do you do cover-ups or touch-ups?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Yes to cover-ups: send a clear photo of the old tattoo with your request so Alexi can plan. Touch-ups on her own work are free within [3 months] of your appointment.</p>
</article>
<article style="border-bottom: 1px solid #3a2a34; padding: 28px 0; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #ffffff">Do I need to be 18?</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.7; font-weight: 400; color: #ece6ea">Yes. You must be 18 or older with a valid government-issued photo ID. No exceptions, even with a parent present.</p>
</article>

<script>
DC.define("FAQ", {"neon": "#ff3fb0"}, (function () {

class Component extends DCLogic {
  hexToRgb(hex) {
    const h = (hex || '#ff3fb0').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  renderVals() {
    const neon = this.props.neon ?? '#ff3fb0';
    const [r, g, b] = this.hexToRgb(neon);
    const c = (a) => `rgba(${r},${g},${b},${a})`;
    const mix = (t) => `rgb(${Math.round(r + (255 - r) * t)},${Math.round(g + (255 - g) * t)},${Math.round(b + (255 - b) * t)})`;
    return { neon, neonSoft: c(0.45), neonText: mix(0.45), tubeMid: mix(0.5), tubeCore: mix(0.88),
      glow: `drop-shadow(0 0 3px ${neon}) drop-shadow(0 0 10px ${neon}) drop-shadow(0 0 24px ${c(0.85)}) drop-shadow(0 0 48px ${c(0.6)})` };
  }
}

return Component;
})());
DC.define("Sticker_Wall", {}, (function () {

class Component extends DCLogic {}

return Component;
})());
DC.mount("FAQ", document.getElementById('app'));
</script>
